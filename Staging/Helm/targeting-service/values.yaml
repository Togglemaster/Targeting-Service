targeting-service:
  replicaCount: 2
  namespace: targeting-service
  image: 778900740186.dkr.ecr.us-east-1.amazonaws.com/targeting-service:cc27566
  imagePullPolicy: IfNotPresent
  port: 8080
  imagePullSecrets:
    - name: ecr-secret
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  probes:
    enabled: true
    path: /health
    startup:
      failureThreshold: 180
      periodSeconds: 1
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 180
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  envFrom:
    - secretRef:
        name: targeting-service-config
    - secretRef:
        name: targeting-service-db-credentials

  ingress:
    path: /targeting-service(/|$)(.*)

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
